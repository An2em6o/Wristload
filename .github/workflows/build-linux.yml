name: Build Linux x86-64

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'linux/**'
      - 'plugins/**'
      - 'pubspec.yaml'
      - 'tool/**'
      - '.github/workflows/build-linux.yml'

jobs:
  build-linux-x64:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 安装构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libayatana-appindicator3-dev libsecret-1-dev

      - name: 生成页面注册表并拉取依赖
        run: |
          dart run tool/generate_page_registry.dart
          flutter pub get

      - name: 编译 release（x86-64）
        run: flutter build linux --release

      - name: 打包 deb（amd64）
        run: bash tool/build_deb.sh

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: wristload-linux-x64
          path: |
            build/linux/x64/release/bundle/
            dist/*.deb
