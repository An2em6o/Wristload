name: Build Desktop (Linux x64/arm64, Windows x64, macOS) + Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'linux/**'
      - 'windows/**'
      - 'macos/**'
      - 'android/**'
      - 'plugins/**'
      - 'pubspec.yaml'
      - 'tool/**'
      - '.github/workflows/build-linux.yml'

jobs:
  build-desktop:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
            build_cmd: flutter build linux --release
            package_files: dist/*.deb
          - os: windows-latest
            target: windows-x64
            build_cmd: flutter build windows --release
            package_files: wristload-windows-x64.zip
          - os: macos-latest
            target: macos-x64
            build_cmd: flutter build macos --release
            package_files: wristload-macos-x64.zip
          - os: ubuntu-latest
            target: android
            build_cmd: flutter build apk --release
            package_files: build/app/outputs/flutter-apk/app-release.apk
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 安装 JDK 17（Android）
        if: matrix.target == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装构建依赖（Linux 桌面）
        if: startsWith(matrix.os, 'ubuntu') && matrix.target != 'android'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libayatana-appindicator3-dev libsecret-1-dev

      - name: 生成页面注册表并拉取依赖
        run: |
          dart run tool/generate_page_registry.dart
          flutter pub get

      - name: 接受 Android SDK 许可
        if: matrix.target == 'android'
        run: yes | flutter doctor --android-licenses

      - name: 编译 release
        run: ${{ matrix.build_cmd }}

      - name: 打包 Linux deb（amd64）
        if: startsWith(matrix.os, 'ubuntu') && matrix.target != 'android'
        run: bash tool/build_deb.sh

      - name: 打包 Windows（zip）
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath wristload-windows-x64.zip -Force

      - name: 打包 macOS（zip）
        if: matrix.os == 'macos-latest'
        run: |
          cd build/macos/Build/Products/Release && zip -r "$GITHUB_WORKSPACE/wristload-macos-x64.zip" wristload.app

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: wristload-${{ matrix.target }}
          path: |
            dist/*.deb
            *.zip
            build/app/outputs/flutter-apk/*.apk
          if-no-files-found: warn

      - name: 获取版本号
        id: version
        shell: bash
        run: echo "version=$(grep -m1 '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)" >> "$GITHUB_OUTPUT"
      # 各平台产物由 release Job 汇总发布（见文件末尾）。

  # Linux arm64：公共 runner 无 arm64 Flutter SDK，改用 arm-runner-action
  # （Chroot + QEMU 用户态仿真）在 x64 主机上模拟 arm64 环境原生构建。
  build-linux-arm64:
    name: Build linux-arm64 (QEMU 模拟)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 在 ARM64 模拟环境中构建
        uses: pguyot/arm-runner-action@v2
        with:
          base_image: raspi_4_bookworm:20231109
          cpu: max:cortex-a72
          bind_mount_repository: true
          # 默认镜像根分区约 2GB：安装构建依赖 + Flutter SDK + 构建产物会
          # 写满（dpkg: No space left on device）。额外扩容 10GB。
          image_additional_mb: 10240
          commands: |
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y --no-install-recommends git curl ca-certificates xz-utils unzip clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libayatana-appindicator3-dev libsecret-1-dev
            # Flutter 3.47 需要 -Wno-deprecated-literal-operator（Clang 17+ 才有）；
            # bookworm 的 clang-14/16 都不认识该选项（-Werror 直接失败），
            # 直接从 LLVM 官方源安装 clang-18 并设为默认。
            curl -fsSL -o /etc/apt/trusted.gpg.d/llvm.asc https://apt.llvm.org/llvm-snapshot.gpg.key
            echo "deb [signed-by=/etc/apt/trusted.gpg.d/llvm.asc] http://apt.llvm.org/bookworm/ llvm-toolchain-bookworm-18 main" > /etc/apt/sources.list.d/llvm.list
            apt-get update -qq
            apt-get install -y --no-install-recommends clang-18
            update-alternatives --install /usr/bin/clang clang /usr/bin/clang-18 100
            update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-18 100
            update-alternatives --set clang /usr/bin/clang-18
            update-alternatives --set clang++ /usr/bin/clang++-18
            # 安装 Flutter stable（官方无 arm64 SDK 压缩包，用 git clone +
            # 首次运行自动下载 linux-arm64 engine artifacts）
            git clone -b stable --depth 1 https://github.com/flutter/flutter.git /opt/flutter
            export PATH="/opt/flutter/bin:$PATH"
            flutter config --no-analytics
            flutter --version
            # 构建
            dart run tool/generate_page_registry.dart
            flutter pub get
            flutter build linux --release
            bash tool/build_deb.sh

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: wristload-linux-arm64
          path: dist/*.deb
          if-no-files-found: warn

      - name: 获取版本号
        id: version
        shell: bash
        run: echo "version=$(grep -m1 '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)" >> "$GITHUB_OUTPUT"
      # 产物由 release Job 汇总发布。

  # 所有平台构建成功后，汇总全部产物到一个 Release。
  release:
    name: 汇总发布 Release（全平台）
    needs: [build-desktop, build-linux-arm64]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 下载全部构建产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 获取版本号
        id: version
        shell: bash
        run: echo "version=$(grep -m1 '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)" >> "$GITHUB_OUTPUT"

      - name: 创建/更新 Release 并上传全部产物
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**
          tag_name: v${{ steps.version.outputs.version }}
          name: Wristload v${{ steps.version.outputs.version }}（全平台：Linux x64/arm64、Windows x64、macOS、Android）
          generate_release_notes: true
